# Flujo E2E (Maestro · ADR-017) — Subir cartola desde mobile con vista previa
# de dos fases + paso de decisión (US-033/ADR-026 + US-003, design.md Phase 6).
#
# Camino crítico: el usuario autenticado abre "Subir cartola" desde la
# pantalla de resumen, selecciona un archivo .xlsx/.pdf real vía el picker
# nativo del SO, VE EL PASO DE DECISIÓN (resumen + tres acciones, sin
# persistir nada — MOB-PRV-03), toca "Subir tal cual", y ve el resumen del
# resultado (totalTransacciones/duplicadosOmitidos). Este es el gate REQUERIDO
# en dispositivo
# real para el boundary multipart + el flujo de dos fases que jest-expo NO
# puede validar (design.md, riesgo HIGH). Debe correrse en un
# dispositivo/simulador real, no en CI. Pasos y prerrequisitos completos:
# docs/mobile-upload-gate-runbook.md.
#
# Requiere una sesión ya iniciada (`login.yaml`) y un archivo fixture .xlsx o
# .pdf válido ya accesible desde el picker nativo del dispositivo (precargado
# en Files/Descargas — el picker del SO no es scriptable de forma
# determinística más allá de tocar el nombre del archivo visible).
appId: cl.moneydiary.app
---
# `clearState` so the gate is deterministic: the session token persists in
# SecureStore across runs (MOB-01), so a plain relaunch would skip the login
# screen that `login.yaml` drives. Starting clean forces the full login path.
- launchApp:
    clearState: true
- runFlow: login.yaml
# Navega al detalle de subida desde el CTA del resumen. Se ancla por `id`
# (no por texto): el encabezado de la propia pantalla de subida también dice
# "Subir cartola", así que `tapOn: "Subir cartola"` sería ambiguo.
- tapOn:
    id: "subir-cartola-button"
# Abre el picker nativo (`expo-document-picker`, filtrado a .xlsx/.pdf — CU-08).
- tapOn:
    id: "subir-archivo-trigger"
# --- PASO DEPENDIENTE DE DISPOSITIVO (ajustar antes de correr) ---
# El picker del SO no es scriptable de forma determinística. Cambiar el nombre
# por el del fixture .xlsx/.pdf realmente precargado en el dispositivo de
# prueba (ver runbook). Sin un fixture accesible, el gate no puede completar.
- tapOn: "cartola-test.xlsx"
# --- FASE 1: VISTA PREVIA + DECISIÓN (US-003 + MOB-PRV-03) ---
# El parse corre en el backend (POST /api/ingestas/preview) y devuelve la
# muestra SIN persistir nada. Esperar la aparición del panel de decisión con
# margen generoso (red real + cold-start del backend gratuito, mismo criterio
# que resumen-semaforo.yaml).
- extendedWaitUntil:
    visible:
      id: "preview-resultado"
    timeout: 40000
# MOB-PRV-03: el paso de decisión muestra el resumen y las tres acciones, sin
# lista de filas todavía (esa solo aparece tras "Revisar y editar").
- assertVisible:
    id: "decision-subir-tal-cual"
- assertVisible:
    id: "decision-revisar"
- assertVisible:
    id: "decision-descartar"
# --- FASE 2: SUBIR TAL CUAL (US-003 CA-03 / MOB-PRV-04) ---
# "Subir tal cual" re-sube el mismo archivo al endpoint de ingesta real
# (POST /api/ingestas/commit) con `edits: []` — recién acá se persiste.
- tapOn:
    id: "decision-subir-tal-cual"
# El estado "subiendo" deshabilita los controles mientras la subida está en
# curso (CU-09) — esperar el resultado con el mismo margen.
- extendedWaitUntil:
    visible: "Cartola subida"
    timeout: 40000
# El resumen del resultado debe mostrar banco/cuenta/totalTransacciones
# (CU-10) — el contenido real depende del fixture usado.
- assertVisible:
    id: "subir-resultado"
