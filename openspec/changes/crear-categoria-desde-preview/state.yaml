blockers:
  - id: rowindex-stability
    phase: design
    blocks: apply
    status: resolved
    resolved_by: design D-07
    detail: >-
      RESOLVED by construction (design.md D-07, fact F-7): rowIndex = the array
      position produced by `transacciones.map((tx, i) => …)`, and the chain that
      builds `transacciones` (detect → validate → normalize) reads ONLY the file
      bytes — no DB, no clock, no session, no randomness. `esDuplicado`/`sugerido`
      are computed after and never reorder. Corollary: between the two previews of
      this flow nothing is persisted, so `sugerido` is the ONLY field that can
      differ. Condition to close: test T-01
      (`apps/api/test/preview-rowindex-estable.spec.ts`, Excel + PDF, empty and
      non-empty catalog) MUST land in PR1, before any re-run wiring ships.
      Recorded fallback if T-01 ever goes red — re-key the overlay by a hash of
      (fecha, descripcion, cargo, abono) — deliberately NOT built.

review_workload:
  400_line_budget_risk: High
  chained_prs_recommended: Yes
  chain_strategy_recommended: feature-branch-chain   # PR2 does not typecheck until PR1's api-client regen lands
  suggested_slices:
    - PR1 api + indice plumbing + openapi.json/api-client regeneration + T-01 (inert for the UI)
    - PR2 web client seam — adopt generated catalog types, postCategoria returns CategoriaDto, cache seeding
    - PR3 preview UI — "+" trigger, inline creation form, demo note (row adopts the categoría, no re-run yet)
    - PR4 orchestration — previewData hoist, re-run, diff announcement, busy/failure states, e2e
  size_exception_note: >-
